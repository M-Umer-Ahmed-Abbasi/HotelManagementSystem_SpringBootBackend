spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hoteldb_test
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:talha}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Disable Stripe in tests
stripe:
  api-key: sk_test_mock_key
  webhook-secret: whsec_mock_secret
  publishable-key: pk_test_mock_key
  enabled: false

# Test-specific app config
app:
  name: Hotel Management System - Test
  version: 1.0.0-TEST
  default-page-size: 10
  max-page-size: 50
