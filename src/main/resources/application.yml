spring:
  application:
    name: hotel-management-system

  # Default profile uses PostgreSQL
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/hoteldb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:talha}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging
logging:
  level:
    com.esd.hotelmanagement: DEBUG
    org.springframework.security: DEBUG

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
  enabled: ${STRIPE_ENABLED:true}

# Application custom properties
app:
  name: Hotel Management System
  version: 1.0.0
  default-page-size: ${APP_DEFAULT_PAGE_SIZE:10}
  max-page-size: ${APP_MAX_PAGE_SIZE:100}
